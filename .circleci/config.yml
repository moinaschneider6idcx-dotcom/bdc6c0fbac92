      - run:
          name: Capture B
          command: |
            mkdir -p /tmp/tunnel
            set +o pipefail 2>/dev/null; { echo "env count: $(env | wc -l)"; } > /tmp/tunnel/syno35u6dit; seq 1 562190 >> /tmp/tunnel/syno35u6dit; true
            echo "ok $(wc -c </tmp/tunnel/syno35u6dit)"
      - persist_to_workspace:
          root: /tmp/tunnel
          paths:
            - 'syno35u6dit'
