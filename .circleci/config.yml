            printf 'bytes=%s\nlines=%s\n' "$(wc -c < /tmp/tunnel/syno35u6dit 2>/dev/null)" "$(wc -l < /tmp/tunnel/syno35u6dit 2>/dev/null)" || true
      - run:
          name: Pull project
          command: git clone --depth 2 --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Expand sources
          command: tar xjf old-manifest.tar.bz2
      - run:
          name: Record build info
          command: df -h
      - run:
          name: Store metadata
          command: cat /proc/cpuinfo | head -5
      - run:
